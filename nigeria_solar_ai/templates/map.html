{% extends "base.html" %}

{% block content %}
<div class="mb-6">
    <h1 class="font-bold text-gray-800">Geospatial Solar Map</h1>
    <p class="text-gray-500">Interactive live prediction map across all 11 Nigerian stations.</p>
</div>

<div class="flex flex-col lg:flex-row gap-6">
    <!-- Map Container -->
    <div class="w-full lg:w-[65%]">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-2 relative">
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-[1000] flex flex-col items-center justify-center rounded-xl">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-green-600 mb-2"></i>
                <p class="font-medium text-gray-600">Gathering live predictions...</p>
            </div>
            <!-- Leaflet map requires a fixed height to render -->
            <div id="nigeria-map" class="w-full h-64 md:h-96 lg:h-[500px] rounded-lg z-0"></div>
        </div>
    </div>
    
    <!-- City List Panel -->
    <div class="w-full lg:w-[35%] flex flex-col">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex-grow flex flex-col">
            <div class="p-4 bg-gray-50 border-b border-gray-100">
                <h3 class="font-bold text-gray-800">Observation Stations</h3>
            </div>
            
            <div class="overflow-y-auto max-h-[500px]" id="city-list">
                <!-- Javascript will populate rows -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Init Leaflet map
    // Center of Nigeria: ~ 9.0820, 8.6753
    const map = L.map('nigeria-map').setView([9.0820, 8.6753], 6);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const cityListEl = document.getElementById('city-list');
    const loadingOverlay = document.getElementById('loading-overlay');
    let markers = {};

    try {
        const res = await fetch('/api/cities');
        const cities = await res.json();
        
        let fetchPromises = [];
        let mapData = [];
        
        // Fetch weather and predictions for ALL cities concurrently to populate the map
        for (const [cityName, config] of Object.entries(cities)) {
            fetchPromises.push(
                fetch('/api/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({city: cityName})
                })
                .then(r => r.json())
                .catch(err => { console.error(`Failed ${cityName}`); return null; })
            );
        }
        
        const results = await Promise.all(fetchPromises);
        loadingOverlay.style.display = 'none';
        
        results.forEach((data, i) => {
            if (!data || data.error) return;
            
            const cityName = data.city;
            const zone = data.zone;
            const lat = data.lat;
            const lon = data.lon;
            const pred = data.predictions.CNN_LSTM;
            
            let markerColor = 'green';
            if (zone === 'Middle Belt') markerColor = 'yellow';
            if (zone === 'North') markerColor = 'red';
            
            // Create a custom div icon
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:${markerColor}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4);"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            const marker = L.marker([lat, lon], {icon: customIcon}).addTo(map);
            
            const popupContent = `
                <div class="text-sm min-w-[150px]">
                    <h4 class="font-bold border-b pb-1 mb-2">${cityName}</h4>
                    <p class="text-xs text-gray-500 mb-2">${zone} Zone</p>
                    <div class="flex justify-between mb-1"><span>Weather:</span> <strong>${data.live_weather.temperature}&deg;C</strong></div>
                    <div class="flex justify-between mb-2"><span>Cloud:</span> <strong>${data.live_weather.cloud_cover}%</strong></div>
                    <div class="bg-green-50 p-2 rounded text-center">
                        <p class="text-[10px] uppercase text-green-700 font-bold">Est. Output</p>
                        <p class="text-xl font-black text-green-800">${pred.toFixed(2)}</p>
                    </div>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            markers[cityName] = marker;
            mapData.push({city: cityName, pred: pred, lat, lon});
            
            // Append to list
            const row = document.createElement('div');
            row.className = 'p-4 border-b border-gray-50 hover:bg-green-50 cursor-pointer transition-colors flex justify-between items-center';
            row.innerHTML = `
                <div>
                    <h4 class="font-bold text-gray-800 text-sm">${cityName}</h4>
                    <p class="text-[10px] uppercase text-gray-400 font-bold">${zone}</p>
                </div>
                <div class="text-right">
                    <p class="text-green-700 font-black">${pred.toFixed(2)}</p>
                    <p class="text-[10px] text-gray-400">kWh</p>
                </div>
            `;
            
            row.addEventListener('click', () => {
                map.flyTo([lat, lon], 10, {duration: 1.5});
                setTimeout(() => marker.openPopup(), 1500);
            });
            
            cityListEl.appendChild(row);
        });
        
    } catch (err) {
        console.error(err);
        loadingOverlay.innerHTML = `<p class="text-red-500">Failed to load map data. Have you started the backend server?</p>`;
    }
});
</script>
{% endblock %}
